# Republishes the data files as assets of the rolling "latest" release on
# every change to main, so apps can fetch them from a stable URL:
#   https://github.com/harvey-withington/usb-device-kb/releases/download/latest/docks.json
name: Publish latest

on:
  push:
    branches: [main]
    paths:
      - docks.json
      - devices.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/validate
      - name: Recreate the latest release with the current files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest docks.json devices.json \
            --title "Latest data" \
            --notes "Published from ${{ github.sha }}. Fetch with If-None-Match; these files change rarely."
